name: Bug
description: Something in the checker, schema, skill, docs or website is wrong.
labels: ["bug"]
body:
  - type: dropdown
    id: part
    attributes:
      label: Part
      options: [Checker (scripts/check.mjs), Schema, Skill or plugin, Docs, Website, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Commands, file contents or the page address.
